# Configuración del servidor
server.port=8080

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/altairalabs_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true

# Configuración de JWT
app.jwt.secret=YourSuperSecretKeyHereItShouldBeAtLeast32CharactersLong
app.jwt.expiration-ms=3600000
app.jwt.refresh-token-expiration-days=7

# Configuración de CORS
app.cors.allowed-origins=http://localhost:3000,https://altairalabs.com

# Configuración de logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.com.altairalabs=DEBUG

