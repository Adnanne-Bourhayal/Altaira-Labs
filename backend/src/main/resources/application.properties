spring.application.name=backend

server.port=8080

altaira.internal-api-token=${INTERNAL_API_TOKEN:dev-internal-token}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/altaira}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:altaira}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:altaira_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
