spring.application.name=backend

spring.config.import=optional:file:/Volumes/T7/Altaira_Labs/.secrets/neon-render.env[.properties]

server.port=${PORT:8080}

altaira.internal-api-token=${INTERNAL_API_TOKEN:dev-internal-token}
altaira.auth.session-hours=${ALTAIRA_AUTH_SESSION_HOURS:8}
altaira.auth.demo-admin.enabled=${ALTAIRA_DEMO_ADMIN_ENABLED:true}
altaira.auth.demo-admin.username=${ALTAIRA_DEMO_ADMIN_USERNAME:admin123}
altaira.auth.demo-admin.password=${ALTAIRA_DEMO_ADMIN_PASSWORD:admin123}
altaira.auth.demo-admin.role=${ALTAIRA_DEMO_ADMIN_ROLE:admin}
altaira.contact.email.enabled=${CONTACT_EMAIL_ENABLED:true}
altaira.contact.email.provider=${CONTACT_EMAIL_PROVIDER:smtp}
altaira.contact.email.to=${CONTACT_NOTIFICATION_TO:altairalabs@gmail.com}
altaira.contact.email.from=${CONTACT_NOTIFICATION_FROM:${spring.mail.username:}}
altaira.contact.email.timeout-ms=${CONTACT_EMAIL_TIMEOUT_MS:6000}
altaira.contact.email.resend.api-key=${RESEND_API_KEY:}
altaira.contact.email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
altaira.contact.admin-dashboard-url=${CONTACT_ADMIN_DASHBOARD_URL:}
altaira.contact.brand-logo-url=${CONTACT_BRAND_LOGO_URL:}
altaira.contact.brand-header-image-url=${CONTACT_BRAND_HEADER_IMAGE_URL:}

spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
