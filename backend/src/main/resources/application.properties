spring.application.name=backend

# External secrets must be selected explicitly. The default points to a repository-local
# optional file so test/local profiles can never inherit the production Neon datasource.
spring.config.import=optional:file:${ALTAIRA_SECRETS_FILE:./.env}[.properties]

server.port=${PORT:8080}

altaira.internal-api-token=${INTERNAL_API_TOKEN:}
altaira.auth.session-hours=${ALTAIRA_AUTH_SESSION_HOURS:8}
altaira.auth.demo-admin.enabled=${ALTAIRA_DEMO_ADMIN_ENABLED:false}
altaira.auth.demo-admin.username=${ALTAIRA_DEMO_ADMIN_USERNAME:}
altaira.auth.demo-admin.password=${ALTAIRA_DEMO_ADMIN_PASSWORD:}
altaira.auth.demo-admin.role=${ALTAIRA_DEMO_ADMIN_ROLE:admin}
altaira.client.invitation.activate-url=${ALTAIRA_CLIENT_INVITATION_ACTIVATE_URL:http://localhost:3000/client/activate}
altaira.client.invitation.expires-days=${ALTAIRA_CLIENT_INVITATION_EXPIRES_DAYS:7}
altaira.client.google.client-id=${GOOGLE_CLIENT_ID:}
altaira.client.google.token-info-url=${GOOGLE_TOKEN_INFO_URL:https://oauth2.googleapis.com/tokeninfo}
altaira.client-crm.webhook.public-url=${CLIENT_CRM_WEBHOOK_PUBLIC_URL:}
altaira.client-crm.alerts.enabled=${CLIENT_CRM_ALERTS_ENABLED:${ONBOARDING_EMAIL_ENABLED:${CONTACT_EMAIL_ENABLED:true}}}
altaira.client-crm.alerts.from=${CLIENT_CRM_ALERTS_FROM:${ONBOARDING_NOTIFICATION_FROM:${CONTACT_NOTIFICATION_FROM:}}}
altaira.client-crm.alerts.resend.api-key=${RESEND_API_KEY:}
altaira.client-crm.alerts.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
altaira.client-crm.alerts.dashboard-url=${CLIENT_CRM_DASHBOARD_URL:}
altaira.client-crm.alerts.timeout-ms=${CLIENT_CRM_ALERTS_TIMEOUT_MS:6000}
altaira.contact.email.enabled=${CONTACT_EMAIL_ENABLED:true}
altaira.contact.email.provider=${CONTACT_EMAIL_PROVIDER:smtp}
altaira.contact.email.to=${CONTACT_NOTIFICATION_TO:altairalabs@gmail.com}
altaira.contact.email.from=${CONTACT_NOTIFICATION_FROM:${spring.mail.username:}}
altaira.contact.email.timeout-ms=${CONTACT_EMAIL_TIMEOUT_MS:6000}
altaira.contact.email.resend.api-key=${RESEND_API_KEY:}
altaira.contact.email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
altaira.contact.admin-dashboard-url=${CONTACT_ADMIN_DASHBOARD_URL:}
altaira.contact.brand-logo-url=${CONTACT_BRAND_LOGO_URL:}
altaira.contact.brand-header-image-url=${CONTACT_BRAND_HEADER_IMAGE_URL:}
altaira.onboarding.email.enabled=${ONBOARDING_EMAIL_ENABLED:${CONTACT_EMAIL_ENABLED:true}}
altaira.onboarding.email.from=${ONBOARDING_NOTIFICATION_FROM:${altaira.contact.email.from:}}
altaira.onboarding.email.admin-to=${ONBOARDING_NOTIFICATION_ADMIN_TO:${CONTACT_NOTIFICATION_TO:altairalabs@gmail.com}}
altaira.onboarding.email.resend.api-key=${RESEND_API_KEY:}
altaira.onboarding.email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
altaira.onboarding.contract-pdf-path=${ONBOARDING_CONTRACT_PDF_PATH:}
altaira.onboarding.storage-dir=${ALTAIRA_ONBOARDING_STORAGE_DIR:${user.home}/.altaira/onboarding-files}
altaira.onboarding.max-file-size-bytes=${ALTAIRA_ONBOARDING_MAX_FILE_SIZE_BYTES:15728640}
altaira.media.s3.enabled=${AWS_S3_ENABLED:false}
altaira.media.s3.region=${AWS_REGION:}
altaira.media.s3.private-bucket=${AWS_S3_PRIVATE_BUCKET:${AWS_BUCKET_NAME:}}
altaira.media.s3.public-bucket=${AWS_S3_PUBLIC_BUCKET:}
altaira.media.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
altaira.media.s3.presign-ttl-seconds=${AWS_S3_PRESIGN_TTL_SECONDS:900}
altaira.github.app.enabled=${GITHUB_APP_ENABLED:false}
altaira.github.provisioning.enabled=${GITHUB_PROVISIONING_ENABLED:false}
altaira.github.dry-run=${GITHUB_DRY_RUN:true}
altaira.github.org=${GITHUB_ORG:Altaira-Labs}
altaira.github.api-base-url=${GITHUB_API_BASE_URL:https://api.github.com}
altaira.github.app.id=${GITHUB_APP_ID:}
altaira.github.app.client-id=${GITHUB_APP_CLIENT_ID:}
altaira.github.app.installation-id=${GITHUB_APP_INSTALLATION_ID:}
altaira.github.app.private-key-base64=${GITHUB_APP_PRIVATE_KEY_BASE64:}
altaira.github.app.webhook-secret=${GITHUB_APP_WEBHOOK_SECRET:}
altaira.jira.enabled=${JIRA_INTEGRATION_ENABLED:false}
altaira.jira.provisioning.enabled=${JIRA_PROVISIONING_ENABLED:false}
altaira.jira.dry-run=${JIRA_DRY_RUN:true}
altaira.jira.base-url=${JIRA_BASE_URL:}
altaira.jira.email=${JIRA_EMAIL:}
altaira.jira.api-token=${JIRA_API_TOKEN:}
altaira.jira.project-key=${JIRA_PROJECT_KEY:}
altaira.jira.issue-type=${JIRA_ISSUE_TYPE:Task}
altaira.service-catalog.seed.enabled=${ALTAIRA_SERVICE_CATALOG_SEED_ENABLED:true}
altaira.commercial.legacy-direct-conversion-enabled=${ALTAIRA_LEGACY_DIRECT_CONVERSION_ENABLED:false}
altaira.commercial.stripe.enabled=${STRIPE_CHECKOUT_ENABLED:false}
altaira.commercial.stripe.mode=${STRIPE_CHECKOUT_MODE:mock}
altaira.commercial.stripe.secret-key=${STRIPE_SECRET_KEY:}
altaira.commercial.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
altaira.commercial.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success}
altaira.commercial.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}
altaira.commercial.stripe.mock-confirmation-enabled=${STRIPE_MOCK_CONFIRMATION_ENABLED:false}
altaira.commercial.email.enabled=${COMMERCIAL_EMAIL_ENABLED:${CONTACT_EMAIL_ENABLED:true}}
altaira.commercial.email.from=${COMMERCIAL_NOTIFICATION_FROM:${ONBOARDING_NOTIFICATION_FROM:${CONTACT_NOTIFICATION_FROM:}}}
altaira.commercial.email.resend.api-key=${RESEND_API_KEY:}
altaira.commercial.email.resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
altaira.commercial.email.timeout-ms=${COMMERCIAL_EMAIL_TIMEOUT_MS:6000}

spring.servlet.multipart.max-file-size=${ONBOARDING_MULTIPART_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${ONBOARDING_MULTIPART_MAX_REQUEST_SIZE:50MB}

spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
