spring.application.name=backend

server.port=8080

altaira.internal-api-token=${INTERNAL_API_TOKEN:dev-internal-token}
altaira.auth.session-hours=${ALTAIRA_AUTH_SESSION_HOURS:8}
altaira.auth.demo-admin.enabled=${ALTAIRA_DEMO_ADMIN_ENABLED:true}
altaira.auth.demo-admin.username=${ALTAIRA_DEMO_ADMIN_USERNAME:admin123}
altaira.auth.demo-admin.password=${ALTAIRA_DEMO_ADMIN_PASSWORD:admin123}
altaira.auth.demo-admin.role=${ALTAIRA_DEMO_ADMIN_ROLE:admin}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/altaira}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:altaira}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:altaira_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
