services:
  postgres:
    image: postgres:16-alpine
    container_name: altaira-postgres
    environment:
      POSTGRES_DB: altaira
      POSTGRES_USER: altaira
      POSTGRES_PASSWORD: altaira_dev_password
    ports:
      - "5432:5432"
    volumes:
      - altaira_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altaira -d altaira"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  altaira_postgres_data:
